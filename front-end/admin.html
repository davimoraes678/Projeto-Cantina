<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Cantina Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
    <header>
        <h1>Gestão da Cantina - COTEMIG</h1>
    </header>
    <main class="container">
        <section class="card">
            <h2>Produtos</h2>
            <form id="form-produto">
                <input type="text" id="produto-nome" placeholder="Nome do Produto" aria-label="Nome do produto" maxlength="100" required>
                <input type="number" step="0.01" id="produto-preco" placeholder="Preço (R$)" aria-label="Preço" required>
                <input type="number" id="produto-estoque" placeholder="Qtd. Estoque" aria-label="Quantidade em estoque" required>
                <select id="produto-categoria" aria-label="Categoria" required>
                    <option value="">Selecione a Categoria...</option>
                </select>
                <input type="text" id="produto-ingredientes" placeholder="Ingredientes" aria-label="Ingredientes" maxlength="500">
                <textarea id="produto-tabela" placeholder="Tabela nutricional" aria-label="Tabela nutricional" maxlength="500"></textarea>
                <label><input type="checkbox" id="produto-ativo" checked> Disponível para os alunos</label>
                <input type="file" id="imagem" accept="image/*" aria-label="Imagem do produto">
                <button type="submit" id="btn-salvar-produto">Cadastrar Produto</button>
                <button type="button" id="btn-cancelar-edicao-produto" style="display:none;">Cancelar edição</button>
            </form>

            <!-- Busca/filtro de produtos (usa a rota GET /api/produtos/buscar) -->
            <form id="form-busca-produto" class="busca-form">
                <select id="busca-categoria" aria-label="Filtrar por categoria">
                    <option value="">Todas as categorias</option>
                </select>
                <input type="number" step="0.01" id="busca-preco-min" placeholder="Preço mín." aria-label="Preço mínimo">
                <input type="number" step="0.01" id="busca-preco-max" placeholder="Preço máx." aria-label="Preço máximo">
                <select id="busca-ordenar" aria-label="Ordenação">
                    <option value="">Sem ordenação</option>
                    <option value="nome">Ordenar por nome</option>
                    <option value="preco">Ordenar por preço</option>
                </select>
                <button type="submit">Buscar</button>
                <button type="button" id="btn-limpar-busca">Limpar</button>
            </form>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Produto</th>
                            <th scope="col">Preço</th>
                            <th scope="col">Estoque</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos-admin"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/front-end/js/alunos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
