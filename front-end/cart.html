<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cantina Real — Meu Pedido</title><link rel="stylesheet" href="css/style.css"><script src="js/cantina.js" defer></script></head>
<body data-page="cart"><main class="app has-bottom-nav">
