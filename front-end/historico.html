<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Pedidos - Cantina Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-dark bg-cantina">
        <div class="container">
            <a class="btn btn-outline-light" href="/front-end/admin.html">← Voltar</a>
            <span class="navbar-brand mb-0 fw-bold">Histórico de Pedidos</span>
        </div>
    </nav>

    <main class="container py-4">
        <section class="card shadow-sm">
            <div class="card-body">
                <p class="text-body-secondary">Pedidos concluídos e cancelados, do mais recente para o mais antigo.</p>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Aluno</th>
                                <th scope="col">Itens</th>
                                <th scope="col">Status</th>
                                <th scope="col">Total</th>
                                <th scope="col">Data</th>
                            </tr>
                        </thead>
                        <!-- data-historico: o carregarPedidos() do alunos.js mostra aqui só os finalizados -->
                        <tbody id="tabela-pedidos" data-historico="sim"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="/front-end/js/alunos.js"></script>
</body>
</html>
