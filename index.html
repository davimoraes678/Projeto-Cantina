<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão da Cantina - COTEMIG</title>
    <link rel="stylesheet" href="front-end/css/style.css">

</head>
<body>
    <header>
        <h1>Cantina Real - Cotemig</h1>
        <button>
            <a href="front-end/admin.html">Administrador</a>
        </button>
        <button>
            <a href="front-end/cadastro.html">Cadastro</a>
        </button>
    </header>
    <main class="container">

        
        <!-- Seção de Produtos -->
        <form id="form-busca-produto" class="busca-form">
            <input type="hidden" id="busca-categoria" value="">
                <button type="button" onclick="filtrar('')">Todas</button>
                <button type="button" onclick="filtrar('Bebida')">Bebidas</button>
                <button type="button" onclick="filtrar('Lanche')">Salgados</button>
                <button type="button" onclick="filtrar('Doce')">Doces</button>
                <input type="number" step="0.01" id="busca-preco-min" placeholder="Preço mín.">
                <input type="number" step="0.01" id="busca-preco-max" placeholder="Preço máx.">
                <select id="busca-ordenar">
                    <option value="">Sem ordenação</option>
                    <option value="nome">Ordenar por nome</option>
                    <option value="preco">Ordenar por preço</option>
                </select>
                <button type="submit">Buscar</button>
                <button type="button" id="btn-limpar-busca">Limpar</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Categoria</th>
                        <th>Quantidade</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos"></tbody>
            </table>

        <!-- Seção de Pedidos -->
        <section class="card">
            <h2>Pedidos</h2>

            <select id="select-aluno" required>
                <option value="">Selecione o Aluno...</option>
            </select>

            <!-- Carrinho do aluno selecionado (itens gravados como ItemPedido no banco) -->
            <table class="carrinho-tabela">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Qtd</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tabela-carrinho"></tbody>
            </table>
            <p id="carrinho-total">Total: R$ 0,00</p>
            <button type="button" id="btn-finalizar-pedido">Finalizar Pedido</button>

            <!-- Edição de pedido (status / horário de retirada) - aparece ao clicar em "Editar" -->
            <form id="form-editar-pedido" style="display:none;">
                <input type="hidden" id="editar-pedido-id">
                <select id="editar-pedido-status" required>
                    <option value="Pendente">Pendente</option>
                    <option value="Em Preparo">Em Preparo</option>
                    <option value="Pronto">Pronto</option>
                    <option value="Concluído">Concluído</option>
                    <option value="Cancelado">Cancelado</option>
                </select>
                <input type="datetime-local" id="editar-pedido-horario">
                <button type="submit">Salvar Pedido</button>
                <button type="button" id="btn-cancelar-edicao-pedido">Cancelar</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Aluno</th>
                        <th>Produtos</th>
                        <th>Status</th>
                        <th>Total</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-pedidos"></tbody>
            </table>
        </section>
    </main>

    <script src="front-end/js/alunos.js"></script>
</body>
</html>
