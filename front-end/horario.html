<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horário de Retirada - Cantina Real</title>
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
    <div class="aviso-prototipo">⚠ Protótipo visual: esta tela ainda não está ligada ao sistema e mostra dados fictícios.</div>

    <header class="topbar">
        <div class="brand">
            <img src="/front-end/assets/logo.png" alt="Cantina Real">
            <div class="brand-name">Cantina<span>Real</span></div>
        </div>
        <div></div>
    </header>

    <main class="center-page schedule">
        <h1>Escolha o Horário<br>Da Retirada</h1>
        <div class="date-grid">
            <div class="choice selected">Hoje<br>29/04</div>
            <div class="choice">Amanhã<br>30/04</div>
            <div class="choice">Segunda<br>04/05</div>
        </div>
        <div class="time-grid">
            <div class="choice">09:30</div>
            <div class="choice selected">10:20</div>
            <div class="choice">10:30</div>
            <div class="choice">11:00</div>
            <div class="choice">11:30</div>
            <div class="choice">12:00</div>
        </div>
        <a class="big-action confirm" href="/front-end/confirmado.html">Confirmar Horário</a>
    </main>

    <script src="/front-end/js/alunos.js"></script>
</body>
</html>
