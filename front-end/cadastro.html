<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <form id="form-aluno" action="/front-end/index.html">
        <input type="text" id="aluno-nome" placeholder="Nome do Aluno" required>
        <input type="email" id="aluno-email" placeholder="E-mail" required>
        <input type="password" id="aluno-senha" placeholder="Senha">
        <button type="submit" id="btn-salvar-aluno">Cadastrar Aluno</button>
       <button type="button" id="btn-cancelar-edicao-aluno" style="display:none;">Cancelar edição</button>
    </form>
    <a href="/front-end/login.html"><button type="button">fazer login</button></a>
    <p id="aviso-edicao-aluno" style="display:none;">Editando aluno - deixe a senha em branco pra não alterá-la.</p>
    <script src="js/alunos.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    

</body>
</html>
