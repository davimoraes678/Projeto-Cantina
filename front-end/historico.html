<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#aa0e1b">
    <title>Histórico de Pedidos - Cantina Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-cantina sticky-top shadow-sm">
        <div class="container">
            <a class="btn btn-outline-light rounded-pill btn-sm d-flex align-items-center gap-1" href="/front-end/admin.html">
                <svg class="icone" aria-hidden="true"><use href="/front-end/assets/icones.svg#arrow-left"></use></svg> Voltar
            </a>
            <span class="navbar-brand mb-0 fw-bold d-flex align-items-center gap-2">
                <img src="/front-end/assets/logo.png" alt="" width="32" height="32"> Histórico de pedidos
            </span>
        </div>
    </nav>

    <main class="container py-4">
        <section class="card border-0 shadow-sm rounded-4">
            <div class="card-body">
                <p class="text-body-secondary">Pedidos concluídos e cancelados, do mais recente para o mais antigo.</p>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Aluno</th>
                                <th scope="col">Itens</th>
                                <th scope="col">Status</th>
                                <th scope="col">Total</th>
                                <th scope="col">Data</th>
                            </tr>
                        </thead>
                        <!-- data-historico: o carregarPedidos() do alunos.js mostra aqui só os finalizados -->
                        <tbody id="tabela-pedidos" data-historico="sim"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="/front-end/js/alunos.js" defer></script>
</body>
</html>
