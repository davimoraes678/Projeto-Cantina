            <div>
                <h1 class="h5 fw-bold mb-0" data-aluno="nome">Aluno</h1>
                <p class="text-body-secondary small mb-1" data-aluno="email"></p>
                <span class="badge rounded-pill text-bg-light border text-capitalize" data-aluno="funcao"></span>
            </div>
        </section>

        <!-- Editar dados: o conta.js preenche e envia para PUT /api/alunos/atual -->
        <form id="form-editar-aluno" class="card card-body border-0 shadow-sm rounded-4 mb-3 d-grid gap-2">
            <h2 class="h6 fw-bold mb-1">Editar dados</h2>
            <div class="form-floating">
                <input class="form-control" type="text" id="aluno-nome" placeholder="Nome" required>
                <label for="aluno-nome">Nome</label>
            </div>
            <div class="form-floating">
                <input class="form-control" type="email" id="aluno-email" placeholder="E-mail" required>
                <label for="aluno-email">E-mail</label>
            </div>
            <div class="form-floating">
                <input class="form-control" type="password" id="aluno-senha" placeholder="Nova senha" autocomplete="new-password">
                <label for="aluno-senha">Nova senha (em branco = não muda)</label>
            </div>
            <button class="btn btn-primary rounded-pill" type="submit">Salvar</button>
        </form>

        <div class="d-grid gap-2">
            <button class="btn btn-outline-danger rounded-pill btn-logout" type="button">Sair</button>
            <button class="btn btn-link btn-sm text-body-secondary" type="button" onclick="removerConta()">Remover minha conta</button>
        </div>

        <!-- Espaço para o conteúdo não ficar atrás da barra de baixo (celular) -->
        <div class="d-md-none py-5"></div>
    </main>
