<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cantina Real - Entrar</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <div class="brand-header">
    <div class="crown-icon">🍽️👑</div>
    <h1>CANTINA <span class="gold">REAL</span></h1>
    <p>Peça Antes, Retire<br />Sem Filas.</p>
  </div>

  <div class="form-wrap">
    <h2 class="center">BEM-VINDO(a)!</h2>
    <p class="center muted" style="margin-top:-8px;">Faça Login Para Continuar</p>

    <form id="formLogin">
      <div class="field-icon-wrap">
        <span class="field-icon">👤</span>
        <input class="form-input" type="text" id="identificador" placeholder="Matrícula ou email" autocomplete="username" required />
      </div>
      <div class="field-icon-wrap">
        <span class="field-icon">🔒</span>
        <input class="form-input" type="password" id="senha" placeholder="Senha" autocomplete="current-password" required />
        <button type="button" class="toggle-eye" id="toggleEye">👁️</button>
      </div>
      <div class="error-msg" id="erro"></div>
      <button type="submit" class="btn" id="btnEntrar">Entrar</button>
    </form>

    <p class="center"><a href="#" class="link-red" id="esqueceuSenha">Esqueceu a Senha?</a></p>
    <p class="center muted" style="margin-top:24px;">
      🕐 Rápido, Prático e Feito<br />para seu intervalo
    </p>

    <p class="center" style="margin-top:20px;">
      Ainda não tem cadastro?
      <a href="register.html" class="link-red">Cadastre-se</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // se já estiver logado, vai direto pro início
  if (getToken()) window.location.href = 'home.html';

  document.getElementById('toggleEye').addEventListener('click', () => {
    const campo = document.getElementById('senha');
    campo.type = campo.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('esqueceuSenha').addEventListener('click', (e) => {
    e.preventDefault();
    alert('Para redefinir sua senha, procure a coordenação da cantina ou entre em contato com o suporte do app.');
  });

  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const erroEl = document.getElementById('erro');
    const btn = document.getElementById('btnEntrar');
    erroEl.textContent = '';
    const identificador = document.getElementById('identificador').value.trim();
    const senha = document.getElementById('senha').value;

    btn.disabled = true;
    btn.textContent = 'Entrando...';
    try {
      const { token, aluno } = await apiFetch('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ identificador, senha })
      });
      setSession(token, aluno);
      window.location.href = 'home.html';
    } catch (err) {
      erroEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
