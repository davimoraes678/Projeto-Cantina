<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Orçamento - Cantina Real</title>
<link rel="stylesheet" href="/front-end/css/style.css">

</head>
<body>

<header class="topbar"><div class="brand"><img src="/front-end/assets/logo.png"><div class="brand-name">Cantina<span>Real</span></div></div><div></div></header>
<main class="page">
<section class="budget-card"><div class="budget-head"><div><div class="title">Meu Orçamento</div><div class="value">R$ 10,00</div></div><div class="change">Alterar</div></div></section>
<section class="budget-card"><div class="title" style="font-size:36px">Lanches até R$10,00</div><div class="budget-products">
<div class="budget-item"><img src="/front-end/assets/enrolado.png"><div><div class="name">Enrolado de presunto/queijo</div><div class="price">R$6,50</div></div><button class="plus-round">+</button></div>
<div class="budget-item"><img src="/front-end/assets/hamburgao.png"><div><div class="name">Hamburgão</div><div class="price">R$6,50</div></div><span class="choice" style="height:65px;padding:0 25px">Esgotado</span></div>
</div></section>
<div class="info-card" style="max-width:none;text-align:left;color:#aaa;background:#eee">Mostrando porções até R$10,00...</div>
</main>
<script src="/front-end/js/alunos.js"></script>
</body>
</html>
