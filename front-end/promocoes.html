<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções - Cantina Real</title>
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
    <div class="aviso-prototipo">⚠ Protótipo visual: esta tela ainda não está ligada ao sistema e mostra dados fictícios.</div>

    <header class="topbar">
        <a class="icon-btn" href="/front-end/index.html" aria-label="Voltar">←</a>
        <div class="header-title">Promoções</div>
        <div></div>
    </header>

    <main class="page">
        <section class="promo-card">
            <div class="promo-title">Sexta Feira</div>
            <div class="promo-content">
                <img src="/front-end/assets/nuggets.png" alt="Nuggets">
                <div>
                    <div class="promo-desc">1 pote de nuggets + 1 refrigerante de 200ml</div>
                    <div class="promo-price">R$ 7,50</div>
                </div>
                <button class="plus-round" type="button">+</button>
            </div>
        </section>
        <section class="promo-card">
            <div class="promo-title">Quarta Feira</div>
            <div class="promo-content">
                <img src="/front-end/assets/hotdog.png" alt="Cachorro quente">
                <div>
                    <div class="promo-desc">1 cachorro quente + 1 refri de 200ml</div>
                    <div class="promo-price">R$ 7,50</div>
                </div>
                <button class="plus-round" type="button">+</button>
            </div>
        </section>
    </main>

    <script src="/front-end/js/alunos.js"></script>
</body>
</html>
