<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>
<body>
    <header>
        <h1>Gestão da Cantina - COTEMIG</h1>
    </header>
    <main class="container">
        <!-- Seção de Alunos -->
        <section class="card">
            
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">Saldo</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-alunos"></tbody>
            </table>
        </section>


        
        <section class="card">
            <h2>Produtos</h2>
            <form id="form-produto">
                <input type="text" id="produto-nome" placeholder="Nome do Produto" required>
                <input type="number" step="0.01" id="produto-preco" placeholder="Preço (R$)" required>
                <input type="number" id="produto-estoque" placeholder="Qtd. Estoque" required>
                <select id="produto-categoria" required>
                    <option value="">Selecione a Categoria...</option>
                    <option value="Bebida">Bebida</option>
                    <option value="Salgado">Salgado</option>
                    <option value="Doce">Doce</option>
                </select>
                <input type="file" id="imagem" accept="image/*">
                <button type="submit" id="btn-salvar-produto">Cadastrar Produto</button>
                <button type="button" id="btn-cancelar-edicao-produto" style="display:none;">Cancelar edição</button>
            </form>

            <!-- Busca/filtro de produtos (usa a rota GET /api/produtos/buscar) -->
            <form id="form-busca-produto" class="busca-form">
                <select id="busca-categoria">
                    <option value="">Todas as categorias</option>
                    <option value="Bebida">Bebida</option>
                    <option value="Salgado">Salgado</option>
                    <option value="Doce">Doce</option>
                </select>
                <input type="number" step="0.01" id="busca-preco-min" placeholder="Preço mín.">
                <input type="number" step="0.01" id="busca-preco-max" placeholder="Preço máx.">
                <select id="busca-ordenar">
                    <option value="">Sem ordenação</option>
                    <option value="nome">Ordenar por nome</option>
                    <option value="preco">Ordenar por preço</option>
                </select>
                <button type="submit">Buscar</button>
                <button type="button" id="btn-limpar-busca">Limpar</button>
            </form>

            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Produto</th>
                        <th scope="col">Preço</th>
                        <th scope="col">Estoque</th>
                        <th scope="col">Categoria</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos-admin"></tbody>
            </table>
        </section>
        </main>
        <script src="js/alunos.js"></script>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        

</body>
</html>
