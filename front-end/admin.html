<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Cantina Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-dark bg-cantina">
        <div class="container">
            <a class="btn btn-outline-light" href="/">← Voltar</a>
            <span class="navbar-brand mb-0 fw-bold">Administração</span>
        </div>
    </nav>

    <main class="container py-4">
        <!-- Alunos (a lista só é carregada para o mestre) -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 card-title">Alunos</h2>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nome</th>
                                <th scope="col">E-mail</th>
                                <th scope="col">Saldo</th>
                                <th scope="col">Função</th>
                                <th scope="col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-alunos"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Produtos -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 card-title">Produtos</h2>
                <form id="form-produto" class="row g-2 mb-4">
                    <div class="col-md-6">
                        <input class="form-control" type="text" id="produto-nome" placeholder="Nome do Produto" required>
                    </div>
                    <div class="col-6 col-md-3">
                        <input class="form-control" type="number" step="0.01" id="produto-preco" placeholder="Preço (R$)" required>
                    </div>
                    <div class="col-6 col-md-3">
                        <input class="form-control" type="number" id="produto-estoque" placeholder="Qtd. Estoque" required>
                    </div>
                    <div class="col-md-6">
                        <select class="form-select" id="produto-categoria" required>
                            <option value="">Selecione a Categoria...</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Salgado">Salgado</option>
                            <option value="Doce">Doce</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" type="file" id="imagem" accept="image/*">
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button class="btn btn-primary" type="submit" id="btn-salvar-produto">Cadastrar Produto</button>
                        <!-- O alunos.js mostra este botão ao editar um produto -->
                        <button class="btn btn-outline-secondary" type="button" id="btn-cancelar-edicao-produto" style="display:none;">Cancelar edição</button>
                    </div>
                </form>

                <!-- Busca/filtro de produtos (usa a rota GET /api/produtos/buscar) -->
                <form id="form-busca-produto" class="row g-2 mb-3">
                    <div class="col-md-3">
                        <select class="form-select" id="busca-categoria">
                            <option value="">Todas as categorias</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Salgado">Salgado</option>
                            <option value="Doce">Doce</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <input class="form-control" type="number" step="0.01" id="busca-preco-min" placeholder="Preço mín.">
                    </div>
                    <div class="col-6 col-md-2">
                        <input class="form-control" type="number" step="0.01" id="busca-preco-max" placeholder="Preço máx.">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="busca-ordenar">
                            <option value="">Sem ordenação</option>
                            <option value="nome">Ordenar por nome</option>
                            <option value="preco">Ordenar por preço</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button class="btn btn-primary flex-fill" type="submit">Buscar</button>
                        <button class="btn btn-outline-secondary flex-fill" type="button" id="btn-limpar-busca">Limpar</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Produto</th>
                                <th scope="col">Preço</th>
                                <th scope="col">Estoque</th>
                                <th scope="col">Categoria</th>
                                <th scope="col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-produtos-admin"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Pedidos -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 card-title">Pedidos</h2>

                <!-- Edição de pedido (status / horário de retirada). O alunos.js mostra ao clicar em "Editar" -->
                <form id="form-editar-pedido" class="row g-2 mb-3" style="display:none;">
                    <input type="hidden" id="editar-pedido-id">
                    <div class="col-md-4">
                        <select class="form-select" id="editar-pedido-status" required>
                            <option value="Pendente">Pendente</option>
                            <option value="Em Preparo">Em Preparo</option>
                            <option value="Pronto">Pronto</option>
                            <option value="Concluído">Concluído</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input class="form-control" type="datetime-local" id="editar-pedido-horario">
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button class="btn btn-primary flex-fill" type="submit">Salvar Pedido</button>
                        <button class="btn btn-outline-secondary flex-fill" type="button" id="btn-cancelar-edicao-pedido">Cancelar</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Aluno</th>
                                <th scope="col">Itens</th>
                                <th scope="col">Status</th>
                                <th scope="col">Total</th>
                                <th scope="col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-pedidos"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Avaliação do pedido. O concluirPedido() do alunos.js "clica" no #open-dialog, que abre o modal -->
    <button type="button" id="open-dialog" hidden data-bs-toggle="modal" data-bs-target="#modal-avaliacao"></button>
    <div class="modal fade" id="modal-avaliacao" tabindex="-1" aria-labelledby="modal-avaliacao-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="form-avaliacao">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-avaliacao-titulo">O que você achou do pedido?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label" for="avaliacao-nota">Nota (1 a 5)</label>
                    <input class="form-control mb-3" type="number" id="avaliacao-nota" min="1" max="5" required>
                    <label class="form-label" for="avaliacao-comentario">Comentário (opcional)</label>
                    <textarea class="form-control" id="avaliacao-comentario" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Pular</button>
                    <button type="submit" class="btn btn-primary">Enviar Avaliação</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="/front-end/js/alunos.js"></script>
</body>
</html>
