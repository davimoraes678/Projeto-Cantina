<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Pedido - Cantina Real</title>
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
    <div class="aviso-prototipo">⚠ Protótipo visual: esta tela ainda não está ligada ao sistema e mostra dados fictícios.</div>

    <header class="topbar">
        <a class="icon-btn" href="/front-end/index.html" aria-label="Voltar">←</a>
        <div class="header-title">Meu Pedido</div>
        <div class="header-right">🛒<span class="badge">3</span></div>
    </header>

    <main class="page">
        <div class="cart-list">
            <div class="cart-item">
                <img src="/front-end/assets/coxinha.png" alt="Coxinha">
                <div>
                    <h3>Coxinha</h3>
                    <div class="price">R$ 6,50</div>
                    <div class="stepper">− <span>1</span> +</div>
                </div>
                <button class="trash" type="button">♜</button>
            </div>
            <div class="cart-item">
                <img src="/front-end/assets/refrigerantes.png" alt="Refrigerante Lata">
                <div>
                    <h3>Refrigerante Lata</h3>
                    <div class="price">R$ 5,50</div>
                    <div class="stepper">− <span>1</span> +</div>
                </div>
                <button class="trash" type="button">♜</button>
            </div>
            <div class="cart-item">
                <img src="/front-end/assets/kitkat.png" alt="KitKat">
                <div>
                    <h3>KitKat</h3>
                    <div class="price">R$ 4,50</div>
                    <div class="stepper">− <span>1</span> +</div>
                </div>
                <button class="trash" type="button">♜</button>
            </div>
        </div>
        <div class="total-row"><span>Total</span><span>R$ 16,50</span></div>
        <div class="pickup-box">◷ &nbsp; Horário Estimado da Retirada:<br><strong>10:20</strong></div>
        <a class="big-action" href="/front-end/horario.html">Confirmar Pedido</a>
    </main>

    <script src="/front-end/js/alunos.js"></script>
</body>
</html>
