<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Real - COTEMIG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <h1 class="h4 mb-0">Cantina Real - Cotemig</h1>
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span id="nome-aluno">Aluno</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/front-end/conta.html">Minha Conta</a></li>
                <li><a class="dropdown-item" href="/front-end/admin.html">Administrador</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button id="btn-logout" class="dropdown-item text-danger" type="button">Logout</button></li>
            </ul>
        </div>
    </header>

    <main class="container py-3">

        <!-- Seção de Produtos -->
        <section>
            <h2 class="h5">Produtos</h2>
            <form id="form-busca-produto" class="busca-form d-flex flex-wrap gap-2 mb-3">
                <input type="hidden" id="busca-categoria" value="">
                <div id="filtro-categorias" class="btn-group" role="group" aria-label="Categorias"></div>
                <input type="number" step="0.01" id="busca-preco-min" class="form-control w-auto" placeholder="Preço mín." aria-label="Preço mínimo">
                <input type="number" step="0.01" id="busca-preco-max" class="form-control w-auto" placeholder="Preço máx." aria-label="Preço máximo">
                <select id="busca-ordenar" class="form-select w-auto" aria-label="Ordenação">
                    <option value="">Sem ordenação</option>
                    <option value="nome">Ordenar por nome</option>
                    <option value="preco">Ordenar por preço</option>
                </select>
                <button type="submit" class="btn btn-primary">Buscar</button>
                <button type="button" id="btn-limpar-busca" class="btn btn-outline-secondary">Limpar</button>
            </form>

            <div id="lista-produtos" class="row g-3"></div>
        </section>

        <!-- Seção de Carrinho e Pedidos -->
        <section class="card mt-4">
            <div class="card-body">
                <h2 class="h5">Pedidos</h2>
                <div class="table-responsive">
                    <table class="table carrinho-tabela">
                        <thead>
                            <tr>
                                <th scope="col">Produto</th>
                                <th scope="col">Qtd</th>
                                <th scope="col">Subtotal</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody id="tabela-carrinho"></tbody>
                    </table>
                </div>
                <p id="carrinho-total">Total: R$ 0,00</p>
                <button type="button" id="btn-finalizar-pedido" class="btn btn-success">Finalizar Pedido</button>

                <!-- Edição de pedido (status / horário de retirada) - aparece ao clicar em "Editar" -->
                <form id="form-editar-pedido" class="gap-2 my-3" style="display:none;">
                    <input type="hidden" id="editar-pedido-id">
                    <select id="editar-pedido-status" class="form-select w-auto" aria-label="Status do pedido" required>
                        <option value="Pendente">Pendente</option>
                        <option value="Em Preparo">Em Preparo</option>
                        <option value="Pronto">Pronto</option>
                        <option value="Concluído">Concluído</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                    <input type="datetime-local" id="editar-pedido-horario" class="form-control w-auto" aria-label="Horário de retirada">
                    <button type="submit" class="btn btn-primary">Salvar Pedido</button>
                    <button type="button" id="btn-cancelar-edicao-pedido" class="btn btn-outline-secondary">Cancelar</button>
                </form>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">ID Pedido</th>
                                <th scope="col">Aluno</th>
                                <th scope="col">Produtos</th>
                                <th scope="col">Status</th>
                                <th scope="col">Total</th>
                                <th scope="col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-pedidos"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Janela de avaliação de um pedido concluído -->
    <div class="modal fade" id="modal-avaliacao" tabindex="-1" aria-labelledby="titulo-avaliacao" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="form-avaliacao">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="titulo-avaliacao">O que você achou do pedido?</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="avaliacao-pedido-id">
                        <label for="avaliacao-nota" class="form-label">Nota (1 a 5)</label>
                        <input type="number" id="avaliacao-nota" class="form-control mb-3" min="1" max="5" required>
                        <label for="avaliacao-comentario" class="form-label">Comentário</label>
                        <textarea id="avaliacao-comentario" class="form-control" rows="4" maxlength="500"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Enviar Avaliação</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/front-end/js/alunos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
