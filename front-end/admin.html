<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#aa0e1b">
    <title>Administração - Cantina Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-cantina sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
                <img src="/front-end/assets/logo.png" alt="" width="36" height="36">
                <span>Cantina <span class="text-cantina-amarelo">Real</span></span>
            </a>
            <ul class="navbar-nav d-none d-md-flex me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Cardápio</a></li>
                <li class="nav-item"><a class="nav-link" href="/front-end/pedidos.html">Meus pedidos</a></li>
                <li class="nav-item"><a class="nav-link" href="/front-end/carteira.html">Carteira</a></li>
                <li class="nav-item so-admin" style="display:none;"><a class="nav-link active" aria-current="page" href="/front-end/admin.html">Administração</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <div class="dropdown d-none d-md-block">
                    <button class="btn btn-outline-light rounded-pill dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span data-aluno="primeiro-nome">Aluno</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="/front-end/conta.html">Meu perfil</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><button class="dropdown-item text-danger btn-logout" type="button">Sair</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-3 py-md-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="h4 fw-bold mb-0">Administração</h1>
            <span class="badge rounded-pill text-bg-light border text-capitalize" data-aluno="funcao"></span>
        </div>

        <!-- Resumo do dia: os números vêm do alunos.js (carregarPedidos e buscarProdutos) -->
        <div class="row row-cols-2 row-cols-md-4 g-2 g-md-3 mb-3">
            <div class="col">
                <button class="card border-0 shadow-sm rounded-4 w-100 h-100 text-start p-3" type="button" onclick="abrirAba('pedidos')">
                    <span class="small text-body-secondary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone text-warning" fill="currentColor" aria-hidden="true"><path d="M308-140h344v-127q0-72-50-121.5T480-438q-72 0-122 49.5T308-267v127ZM160-80v-60h88v-127q0-71 40-129t106-84q-66-27-106-85t-40-129v-126h-88v-60h640v60h-88v126q0 71-40 129t-106 85q66 26 106 84t40 129v127h88v60H160Z"/></svg> Em preparo</span>
                    <span class="fs-3 fw-bold" id="resumo-andamento">0</span>
                </button>
            </div>
            <div class="col">
                <button class="card border-0 shadow-sm rounded-4 w-100 h-100 text-start p-3" type="button" onclick="abrirAba('historico')">
                    <span class="small text-body-secondary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone text-success" fill="currentColor" aria-hidden="true"><path d="m421-298 283-283-46-45-237 237-120-120-45 45 165 166Zm59 218q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-156t86-127Q252-817 325-848.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 82-31.5 155T763-197.5q-54 54.5-127 86T480-80Zm0-60q142 0 241-99.5T820-480q0-142-99-241t-241-99q-141 0-240.5 99T140-480q0 141 99.5 240.5T480-140Zm0-340Z"/></svg> Entregues hoje</span>
                    <span class="fs-3 fw-bold" id="resumo-concluidos">0</span>
                </button>
            </div>
            <div class="col">
                <div class="card border-0 shadow-sm rounded-4 h-100 p-3">
                    <span class="small text-body-secondary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone text-primary" fill="currentColor" aria-hidden="true"><path d="M540-420q-50 0-85-35t-35-85q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35ZM220-280q-24.75 0-42.37-17.63Q160-315.25 160-340v-400q0-24.75 17.63-42.38Q195.25-800 220-800h640q24.75 0 42.38 17.62Q920-764.75 920-740v400q0 24.75-17.62 42.37Q884.75-280 860-280H220Zm100-60h440q0-42 29-71t71-29v-200q-42 0-71-29t-29-71H320q0 42-29 71t-71 29v200q42 0 71 29t29 71Zm480 180H100q-24.75 0-42.37-17.63Q40-195.25 40-220v-460h60v460h700v60ZM220-340v-400 400Z"/></svg> Vendido hoje</span>
                    <span class="fs-3 fw-bold" id="resumo-vendido">R$ 0,00</span>
                </div>
            </div>
            <div class="col">
                <div class="card border-0 shadow-sm rounded-4 h-100 p-3">
                    <span class="small text-body-secondary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone text-danger" fill="currentColor" aria-hidden="true"><path d="M180-80q-24.75 0-42.37-17.63Q120-115.25 120-140v-483q-17-6-28.5-21.39T80-680v-140q0-24.75 17.63-42.38Q115.25-880 140-880h680q24.75 0 42.38 17.62Q880-844.75 880-820v140q0 20.22-11.5 35.61T840-623v483q0 24.75-17.62 42.37Q804.75-80 780-80H180Zm0-540v480h600v-480H180Zm-40-60h680v-140H140v140Zm220 260h240v-60H360v60Zm120 40Z"/></svg> Estoque baixo</span>
                    <span class="fs-3 fw-bold" id="resumo-estoque">0</span>
                </div>
            </div>
        </div>

        <!-- Abas: Pedidos e Histórico (admin e mestre); Produtos e Alunos (só mestre) -->
        <ul class="nav nav-pills flex-nowrap overflow-x-auto bg-white rounded-pill shadow-sm p-1 mb-3" role="tablist">
            <li class="nav-item flex-fill" role="presentation">
                <button class="nav-link rounded-pill w-100 text-nowrap px-2 active" id="aba-pedidos-btn" data-bs-toggle="pill" data-bs-target="#aba-pedidos" type="button" role="tab" aria-controls="aba-pedidos" aria-selected="true">
                    Pedidos <span class="badge rounded-pill bg-warning text-dark ms-1 d-none" id="contador-pedidos-admin"></span>
                </button>
            </li>
            <li class="nav-item flex-fill" role="presentation">
                <button class="nav-link rounded-pill w-100 text-nowrap px-2" id="aba-historico-btn" data-bs-toggle="pill" data-bs-target="#aba-historico" type="button" role="tab" aria-controls="aba-historico" aria-selected="false">Histórico</button>
            </li>
            <li class="nav-item flex-fill so-mestre" style="display:none;" role="presentation">
                <button class="nav-link rounded-pill w-100 text-nowrap px-2" id="aba-produtos-btn" data-bs-toggle="pill" data-bs-target="#aba-produtos" type="button" role="tab" aria-controls="aba-produtos" aria-selected="false">Produtos</button>
            </li>
            <li class="nav-item flex-fill so-mestre" style="display:none;" role="presentation">
                <button class="nav-link rounded-pill w-100 text-nowrap px-2" id="aba-alunos-btn" data-bs-toggle="pill" data-bs-target="#aba-alunos" type="button" role="tab" aria-controls="aba-alunos" aria-selected="false">Alunos</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- PEDIDOS: um card por pedido "Pendente", com o código de retirada em destaque -->
            <div class="tab-pane fade show active" id="aba-pedidos" role="tabpanel" aria-labelledby="aba-pedidos-btn" tabindex="0">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <small class="text-body-secondary">Do mais antigo para o mais novo. Atualiza sozinho a cada 20 segundos.</small>
                    <button class="btn btn-light border btn-sm rounded-pill text-nowrap" type="button" onclick="carregarPedidos()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone" fill="currentColor" aria-hidden="true"><path d="M480-160q-133 0-226.5-93.5T160-480q0-133 93.5-226.5T480-800q85 0 149 34.5T740-671v-129h60v254H546v-60h168q-38-60-97-97t-137-37q-109 0-184.5 75.5T220-480q0 109 75.5 184.5T480-220q83 0 152-47.5T728-393h62q-29 105-115 169t-195 64Z"/></svg> Atualizar
                    </button>
                </div>
                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" id="lista-pedidos-admin"></div>
            </div>

            <!-- HISTÓRICO: pedidos entregues e cancelados, com filtro e busca -->
            <div class="tab-pane fade" id="aba-historico" role="tabpanel" aria-labelledby="aba-historico-btn" tabindex="0">
                <div class="d-flex flex-wrap gap-2 mb-2">
                    <div class="btn-group btn-group-sm" role="group" aria-label="Filtrar histórico">
                        <input type="radio" class="btn-check" name="filtro-historico" id="filtro-todos" value="" checked>
                        <label class="btn btn-outline-secondary" for="filtro-todos">Todos</label>
                        <input type="radio" class="btn-check" name="filtro-historico" id="filtro-concluidos" value="Concluído">
                        <label class="btn btn-outline-secondary" for="filtro-concluidos">Entregues</label>
                        <input type="radio" class="btn-check" name="filtro-historico" id="filtro-cancelados" value="Cancelado">
                        <label class="btn btn-outline-secondary" for="filtro-cancelados">Cancelados</label>
                    </div>
                    <input class="form-control form-control-sm flex-grow-1" style="max-width: 320px;" type="search" id="busca-historico" placeholder="Buscar aluno ou código" aria-label="Buscar aluno ou código">
                </div>
                <div class="list-group shadow-sm rounded-4" id="lista-historico-admin"></div>
            </div>

            <!-- PRODUTOS (só mestre): lista com busca; "Novo produto" e "Editar" abrem a janela #modal-produto -->
            <div class="tab-pane fade" id="aba-produtos" role="tabpanel" aria-labelledby="aba-produtos-btn" tabindex="0">
                <div class="d-flex flex-wrap gap-2 mb-2">
                    <input class="form-control flex-grow-1" style="max-width: 320px;" type="search" id="busca-produto-admin" placeholder="Buscar produto" aria-label="Buscar produto">
                    <!-- A categoria usa a rota GET /api/produtos/buscar (procedure sp_produtos_por_categoria) -->
                    <select class="form-select w-auto" id="busca-categoria" aria-label="Categoria">
                        <option value="">Todas as categorias</option>
                        <option value="Salgado">Salgado</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Doce">Doce</option>
                    </select>
                    <button class="btn btn-primary rounded-pill ms-auto" type="button" onclick="novoProduto()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone" fill="currentColor" aria-hidden="true"><path d="M450-450H200v-60h250v-250h60v250h250v60H510v250h-60v-250Z"/></svg> Novo produto
                    </button>
                </div>
                <div class="list-group shadow-sm rounded-4" id="lista-produtos-admin"></div>
            </div>

            <!-- ALUNOS (só mestre): promover a admin e excluir -->
            <div class="tab-pane fade" id="aba-alunos" role="tabpanel" aria-labelledby="aba-alunos-btn" tabindex="0">
                <input class="form-control mb-2" style="max-width: 320px;" type="search" id="busca-aluno-admin" placeholder="Buscar aluno" aria-label="Buscar aluno">
                <div class="list-group shadow-sm rounded-4" id="lista-alunos"></div>
            </div>
        </div>

        <div class="d-md-none py-5"></div>
    </main>

    <!-- Celular: barra de navegação de baixo -->
    <div class="fixed-bottom d-md-none">
        <nav class="nav nav-justified flex-nowrap bg-white border-top shadow" aria-label="Navegação principal">
            <a class="nav-link d-flex flex-column align-items-center small py-2 px-0" href="/">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone fs-4" fill="currentColor" aria-hidden="true"><path d="M285-80v-368q-52-11-88.5-52.5T160-600v-280h60v280h65v-280h60v280h65v-280h60v280q0 58-36.5 99.5T345-448v368h-60Zm415 0v-320H585v-305q0-79 48-127t127-48v800h-60Z"/></svg>Cardápio
            </a>
            <a class="nav-link d-flex flex-column align-items-center small py-2 px-0" href="/front-end/pedidos.html">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone fs-4" fill="currentColor" aria-hidden="true"><path d="M222-80q-43.75 0-74.37-30.63Q117-141.25 117-185v-125h127v-570l59.8 60 59.8-60 59.8 60 59.8-60 59.8 60 60-60 60 60 60-60 60 60 60-60v695q0 43.75-30.62 74.37Q781.75-80 738-80H222Zm516-60q20 0 32.5-12.5T783-185v-595H304v470h389v125q0 20 12.5 32.5T738-140ZM357-622v-60h240v60H357Zm0 134v-60h240v60H357Zm333-134q-12 0-21-9t-9-21q0-12 9-21t21-9q12 0 21 9t9 21q0 12-9 21t-21 9Zm0 129q-12 0-21-9t-9-21q0-12 9-21t21-9q12 0 21 9t9 21q0 12-9 21t-21 9ZM221-140h412v-110H177v65q0 20 12.65 32.5T221-140Zm-44 0v-110 110Z"/></svg>Pedidos
            </a>
            <a class="nav-link d-flex flex-column align-items-center small py-2 px-0" href="/front-end/carteira.html">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone fs-4" fill="currentColor" aria-hidden="true"><path d="M180-233v53-600 547Zm0 113q-24.75 0-42.37-17.63Q120-155.25 120-180v-600q0-24.75 17.63-42.38Q155.25-840 180-840h600q24.75 0 42.38 17.62Q840-804.75 840-780v134h-60v-134H180v600h600v-133h60v133q0 24.75-17.62 42.37Q804.75-120 780-120H180Zm358-173q-30.52 0-52.26-21.44Q464-335.89 464-366v-227q0-30.11 21.74-51.56Q507.48-666 538-666h270q30.53 0 52.26 21.44Q882-623.11 882-593v227q0 30.11-21.74 51.56Q838.53-293 808-293H538Zm284-60v-253H524v253h298Zm-124.5-81.96Q716-453.92 716-481q0-26.25-19-44.63Q678-544 652-544t-45 18.37q-19 18.38-19 44.63 0 27.08 18.74 46.04Q625.47-416 652.24-416q26.76 0 45.26-18.96Z"/></svg>Carteira
            </a>
            <!-- Só aparece para admin e mestre (o alunos.js mostra) -->
            <a class="nav-link small py-2 px-0 so-admin active" style="display:none;" aria-current="page" href="/front-end/admin.html">
                <span class="d-flex flex-column align-items-center"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone fs-4" fill="currentColor" aria-hidden="true"><path d="m388-80-20-126q-19-7-40-19t-37-25l-118 54-93-164 108-79q-2-9-2.5-20.5T185-480q0-9 .5-20.5T188-521L80-600l93-164 118 54q16-13 37-25t40-18l20-127h184l20 126q19 7 40.5 18.5T669-710l118-54 93 164-108 77q2 10 2.5 21.5t.5 21.5q0 10-.5 21t-2.5 21l108 78-93 164-118-54q-16 13-36.5 25.5T592-206L572-80H388Zm48-60h88l14-112q33-8 62.5-25t53.5-41l106 46 40-72-94-69q4-17 6.5-33.5T715-480q0-17-2-33.5t-7-33.5l94-69-40-72-106 46q-23-26-52-43.5T538-708l-14-112h-88l-14 112q-34 7-63.5 24T306-642l-106-46-40 72 94 69q-4 17-6.5 33.5T245-480q0 17 2.5 33.5T254-413l-94 69 40 72 106-46q24 24 53.5 41t62.5 25l14 112Zm44-210q54 0 92-38t38-92q0-54-38-92t-92-38q-54 0-92 38t-38 92q0 54 38 92t92 38Zm0-130Z"/></svg>Admin</span>
            </a>
            <a class="nav-link d-flex flex-column align-items-center small py-2 px-0" href="/front-end/conta.html">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icone fs-4" fill="currentColor" aria-hidden="true"><path d="M372-523q-42-42-42-108t42-108q42-42 108-42t108 42q42 42 42 108t-42 108q-42 42-108 42t-108-42ZM160-160v-94q0-38 19-65t49-41q67-30 128.5-45T480-420q62 0 123 15.5T731-360q31 14 50 41t19 65v94H160Zm60-60h520v-34q0-16-9.5-30.5T707-306q-64-31-117-42.5T480-360q-57 0-111 11.5T252-306q-14 7-23 21.5t-9 30.5v34Zm324.5-346.5Q570-592 570-631t-25.5-64.5Q519-721 480-721t-64.5 25.5Q390-670 390-631t25.5 64.5Q441-541 480-541t64.5-25.5ZM480-631Zm0 411Z"/></svg>Perfil
            </a>
        </nav>
    </div>

    <!-- Produto: janela usada para cadastrar (novoProduto) e editar (editarProduto) -->
    <div class="modal fade" id="modal-produto" tabindex="-1" aria-labelledby="modal-produto-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content border-0 rounded-4" id="form-produto">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="modal-produto-titulo">Novo produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body d-grid gap-2">
                    <div class="form-floating">
                        <input class="form-control" type="text" id="produto-nome" placeholder="Nome" required>
                        <label for="produto-nome">Nome do produto</label>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="form-floating">
                                <input class="form-control" type="number" step="0.01" min="0" id="produto-preco" placeholder="Preço" required>
                                <label for="produto-preco">Preço (R$)</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-floating">
                                <input class="form-control" type="number" min="0" id="produto-estoque" placeholder="Estoque" required>
                                <label for="produto-estoque">Estoque</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-floating">
                        <select class="form-select" id="produto-categoria" required>
                            <option value="">Escolha...</option>
                            <option value="Salgado">Salgado</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Doce">Doce</option>
                        </select>
                        <label for="produto-categoria">Categoria</label>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <!-- Foto atual (ao editar) ou a escolhida agora -->
                        <img id="produto-imagem-previa" src="" alt="" width="64" height="64" class="rounded border object-fit-contain bg-body-tertiary d-none">
                        <div class="flex-grow-1">
                            <label class="form-label small mb-1" for="imagem">Foto (PNG, JPG ou WEBP até 5 MB)</label>
                            <input class="form-control form-control-sm" type="file" id="imagem" accept="image/*">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-link text-body-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4" id="btn-salvar-produto">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="/front-end/js/alunos.js" defer></script>
</body>
