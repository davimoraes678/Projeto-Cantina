<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantina Real</title>
<link rel="stylesheet" href="/front-end/css/style.css">

</head>
<body>

<header class="topbar">
  <button class="icon-btn" type="button" aria-label="Menu">☰</button>
  <div class="header-title">Olá, <span id="nome-aluno">Usuário</span> 👆</div>
  <a class="header-right" href="#pedido" aria-label="Carrinho">🛒<span class="badge">3</span></a>
</header>
<main class="page bottom-space">
  <form id="form-busca-produto" class="search-box">
    <input type="hidden" id="busca-categoria" value="">
    <input class="search-input" type="search" placeholder="Busca no Cardápio...">
    <button class="search-btn" type="submit">⌕</button>
    <input type="number" step="0.01" id="busca-preco-min" style="display:none">
    <input type="number" step="0.01" id="busca-preco-max" style="display:none">
    <select id="busca-ordenar" style="display:none"><option value="">Sem ordenação</option></select>
    <button type="button" id="btn-limpar-busca" style="display:none">Limpar</button>
  </form>
  <div class="category-row">
    <button class="active" type="button" onclick="filtrar('')">Todos</button>
    <button type="button" onclick="filtrar('Salgado')">Salgados</button>
    <button type="button" onclick="filtrar('Bebida')">Bebidas</button>
    <button type="button" onclick="filtrar('Doce')">Doces</button>
  </div>
  <div id="tabela-produtos"></div>

  <section class="panel" id="pedido" style="margin-top:50px">
    <h2>Meu Pedido</h2>
    <div class="table-wrap">
      <table><thead><tr><th>Produto</th><th>Qtd</th><th>Subtotal</th><th></th></tr></thead>
      <tbody id="tabela-carrinho"></tbody></table>
    </div>
    <div id="carrinho-total" class="total-row">Total: R$ 0,00</div>
    <div class="pickup-box">◷ &nbsp; Horário Estimado da Retirada:<br><strong>10:20</strong></div>
    <button id="btn-finalizar-pedido" class="big-action" type="button">Confirmar Pedido</button>
  </section>
</main>

<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:30px 0"><a class="filter-btn" href="/front-end/pedido.html" style="padding:18px 28px">Meu Pedido</a><a class="filter-btn" href="/front-end/horario.html" style="padding:18px 28px">Horário</a><a class="filter-btn" href="/front-end/orcamento.html" style="padding:18px 28px">Orçamento</a><a class="filter-btn" href="/front-end/promocoes.html" style="padding:18px 28px">Promoções</a><a class="filter-btn" href="/front-end/cozinha.html" style="padding:18px 28px">Cozinha</a></div><nav class="bottom-nav">
  <a class="active" href="/front-end/index.html">⌂</a>
  <a href="#pedido">☷</a>
  <a href="/front-end/conta.html">♙</a>
</nav>
<div id="pedido-avaliacao"></div>
<script src="/front-end/js/alunos.js"></script>
</body>
</html>
