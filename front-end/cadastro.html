<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#aa0e1b">
    <title>Criar conta - Cantina Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Ícones: Material Symbols Rounded do Google Fonts (https://fonts.google.com/icons).
         icon_names = só os ícones que o site usa (em ordem alfabética), para baixar pouco.
         Ícone novo? Acrescente o nome nessa lista, em todas as páginas. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance_wallet,add,bakery_dining,cake,check,check_circle,chevron_right,delete,edit,hourglass_top,inventory_2,local_cafe,local_fire_department,logout,payments,person,receipt_long,refresh,remove,replay,restaurant,search,search_off,settings,shopping_basket,shopping_cart,star,tune&display=block">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body class="bg-cantina bg-gradient">
    <main class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="text-center text-white mb-3">
            <img src="/front-end/assets/logo.png" alt="Cantina Real" width="88" height="88" class="bg-white rounded-circle p-1 shadow">
            <p class="h4 fw-bold mt-2 mb-0">Cantina <span class="text-cantina-amarelo">Real</span></p>
            <p class="opacity-75 mb-0">Peça antes, retire sem fila.</p>
        </div>
        <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 400px;">
            <div class="card-body p-4">
                <h1 class="h5 fw-bold mb-1">Criar conta</h1>
                <p class="text-body-secondary small mb-3">Leva menos de um minuto.</p>
                <form id="form-aluno" class="d-grid gap-2">
                    <div class="form-floating">
                        <input class="form-control" type="text" id="aluno-nome" placeholder="Nome" autocomplete="name" required>
                        <label for="aluno-nome">Nome</label>
                    </div>
                    <div class="form-floating">
                        <input class="form-control" type="email" id="aluno-email" placeholder="E-mail" autocomplete="email" required>
                        <label for="aluno-email">E-mail</label>
                    </div>
                    <div class="form-floating">
                        <input class="form-control" type="password" id="aluno-senha" placeholder="Senha" autocomplete="new-password" required>
                        <label for="aluno-senha">Senha</label>
                    </div>
                    <button class="btn btn-primary btn-lg rounded-pill mt-2" type="submit" id="btn-salvar-aluno">Criar conta</button>
                </form>
                <p class="text-center small mt-3 mb-0">
                    Já tem conta? <a href="/front-end/login.html" class="fw-semibold">Entrar</a>
                </p>
            </div>
        </div>
        <!-- Os três passos da cantina -->
        <div class="d-flex gap-3 text-white small opacity-75 mt-3">
            <span><span class="material-symbols-rounded icone me-1" aria-hidden="true">restaurant</span>Escolha</span><span><span class="material-symbols-rounded icone me-1" aria-hidden="true">account_balance_wallet</span>Pague com a carteira</span><span><span class="material-symbols-rounded icone me-1" aria-hidden="true">shopping_basket</span>Retire</span>
        </div>
    </main>

    <script src="/front-end/js/alunos.js" defer></script>
</body>
</html>
