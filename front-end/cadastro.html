<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cantina Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
    <form id="form-aluno">
        <input type="text" id="aluno-nome" placeholder="Nome do Aluno" aria-label="Nome" required>
        <input type="email" id="aluno-email" placeholder="E-mail" aria-label="E-mail" required>
        <input type="password" id="aluno-senha" placeholder="Senha" aria-label="Senha" required>
        <button type="submit" id="btn-salvar-aluno">Cadastrar Aluno</button>
    </form>
    <a href="/front-end/login.html"><button type="button">fazer login</button></a>

    <script src="/front-end/js/alunos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
