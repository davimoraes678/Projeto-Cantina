<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#aa0e1b">
    <title>Entrar - Cantina Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body class="bg-cantina bg-gradient">
    <main class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="text-center text-white mb-3">
            <img src="/front-end/assets/logo.png" alt="Cantina Real" width="88" height="88" class="bg-white rounded-circle p-1 shadow">
            <p class="h4 fw-bold mt-2 mb-0">Cantina <span class="text-cantina-amarelo">Real</span></p>
            <p class="opacity-75 mb-0">Peça antes, retire sem fila.</p>
        </div>
        <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 400px;">
            <div class="card-body p-4">
                <h1 class="h5 fw-bold mb-1">Entrar</h1>
                <p class="text-body-secondary small mb-3">Bem-vindo de volta! Faça login para pedir.</p>
                <form id="form-aluno-login" class="d-grid gap-2">
                    <div class="form-floating">
                        <input class="form-control" type="email" id="aluno-email" placeholder="E-mail" autocomplete="email" required>
                        <label for="aluno-email">E-mail</label>
                    </div>
                    <div class="form-floating">
                        <input class="form-control" type="password" id="aluno-senha" placeholder="Senha" autocomplete="current-password" required>
                        <label for="aluno-senha">Senha</label>
                    </div>
                    <button class="btn btn-primary btn-lg rounded-pill mt-2" type="submit" id="btn-salvar-aluno">Entrar</button>
                </form>
                <p class="text-center small mt-3 mb-0">
                    Ainda não tem conta? <a href="/front-end/cadastro.html" class="fw-semibold">Cadastre-se</a>
                </p>
            </div>
        </div>
        <!-- Os três passos da cantina -->
        <div class="d-flex gap-3 text-white small opacity-75 mt-3">
            <span><svg class="icone me-1" aria-hidden="true"><use href="/front-end/assets/icones.svg#restaurant"></use></svg>Escolha</span><span><svg class="icone me-1" aria-hidden="true"><use href="/front-end/assets/icones.svg#account_balance_wallet"></use></svg>Pague com a carteira</span><span><svg class="icone me-1" aria-hidden="true"><use href="/front-end/assets/icones.svg#shopping_basket"></use></svg>Retire</span>
        </div>
    </main>

    <script src="/front-end/js/alunos.js" defer></script>
</body>
</html>
